
{% extends 'blog/base.html' %}

{% block title %}{{ post.title }} | Blogger{% endblock %}

{% block content %}

<section class="page-heading">
    <span class="eyebrow">POST DETAILS</span>
    <h1>{{ post.title }}</h1>
    <p>
        Published on {{ post.published_at|date:"F d, Y - h:i A" }}
    </p>
</section>

<section class="form-card">

    {% if post.image %}
        <img
            src="{{ post.image.url }}"
            alt="{{ post.title }}"
            style="width: 100%; border-radius: 12px; margin-bottom: 24px;"
        >
    {% endif %}

    <div class="post-content" style="margin-bottom: 30px;">
    {{ post.content|linebreaks }}
    </div>

    <a href="{% url 'home' %}" class="submit-button">
        Back to Home
    </a>

</section>

{% endblock %}
