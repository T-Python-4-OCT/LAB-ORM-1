
{% extends 'blog/base.html' %}

{% block title %}Edit Post | Blogger{% endblock %}

{% block content %}

<section class="page-heading">
    <span class="eyebrow">UPDATE YOUR POST</span>
    <h1>Edit your post.</h1>
    <p>Make changes to your published post.</p>
</section>

<section class="form-card">

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">Post Title</label>
            <input
                type="text"
                id="title"
                name="title"
                maxlength="2048"
                value="{{ post.title }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="content">Post Content</label>
            <textarea
                id="content"
                name="content"
                required
            >{{ post.content }}</textarea>
        </div>

        <div class="form-group">
            <label for="image">Replace Post Image (Optional)</label>

            {% if post.image %}
                <img
                    src="{{ post.image.url }}"
                    alt="{{ post.title }}"
                    style="width: 100%; border-radius: 12px; margin-bottom: 15px;"
                >
            {% endif %}

            <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
            >
        </div>

        <button type="submit" class="submit-button">
            Save Changes
        </button>

    </form>

</section>

{% endblock %}
