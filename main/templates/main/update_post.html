{% extends 'main/base.html' %}

{% block title %}Edit {{ post.title }} | Blogger{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <h1>Edit Post</h1>
        <p class="subtitle">Change anything you like.</p>
    </div>
</div>

<form method="POST" enctype="multipart/form-data" class="post-form">
    {% csrf_token %}

    <label for="title">Title</label>
    <input type="text" id="title" name="title" maxlength="2048" value="{{ post.title }}" required>

    <label for="content">Content</label>
    <textarea id="content" name="content" rows="8" required>{{ post.content }}</textarea>

    <label for="image">Image (optional)</label>
    {% if post.image %}
    <img src="{{ post.image.url }}" alt="{{ post.title }}" class="post-image">
    {% endif %}
    <input type="file" id="image" name="image" accept="image/*">
    <img id="image-preview" class="image-preview" alt="Preview" hidden>

    <div class="form-actions">
        <button type="submit" class="btn">Save changes</button>
        <a class="btn-link" href="{% url 'main:post_detail' post.id %}">Cancel</a>
    </div>
</form>

<script>
  const input = document.getElementById("image");
  const preview = document.getElementById("image-preview");

  input.addEventListener("change", function () {
    const file = input.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
    } else {
      preview.hidden = true;
    }
  });
</script>
{% endblock %}
