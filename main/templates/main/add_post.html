{% extends "main/base.html" %}

{% block title %}Blogger | Write a post{% endblock %}

{% block content %}
<section class="container page form-page">
  <h1 class="page-title">Write a post</h1>
  <p class="page-subtitle">The date and time are added when you save.</p>

  <form method="post" action="{% url 'main:add_post' %}" class="post-form">
    {% csrf_token %}

    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" class="input"
             maxlength="2048" required placeholder="A night at the Edge of the World">
    </div>

    <div class="field">
      <label for="content">Content</label>
      <textarea id="content" name="content" class="input" rows="8"
                required placeholder="Start writing your post"></textarea>
    </div>

    <fieldset class="field status">
      <legend>Status</legend>
      <div class="status-options">
        <label class="choice choice--publish">
          <input type="radio" name="status" value="published" checked>
          <span>
            <span class="choice-title">Publish now</span>
            <span class="choice-hint">Shown as published</span>
          </span>
        </label>

       <label class="choice choice--unpublished">
         <input type="radio" name="status" value="unpublished">
           <span>
            <span class="choice-title">Don't publish</span>
            <span class="choice-hint">Shown as not published</span>
            </span>
        </label>
      </div>
    </fieldset>

    <div class="form-actions">
      <a href="{% url 'main:home' %}" class="link-cancel">Cancel</a>
      <button type="submit" class="btn">Save post</button>
    </div>
  </form>
</section>
{% endblock %}
