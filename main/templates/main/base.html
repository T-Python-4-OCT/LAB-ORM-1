{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | Blogger</title>

    <link rel="icon" href="{% static 'main/images/logo.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>
<body>

    <header class="site-header">
        <div class="container nav">
            <a href="{% url 'main:home' %}" class="logo">
                <img src="{% static 'main/images/logo.svg' %}" alt="شعار Blogger">
                <span>Blogger</span>
            </a>
            <nav class="nav-links">
                <a href="{% url 'main:home' %}" class="nav-link {% block nav_home %}{% endblock %}">
                    <i class="bi bi-house"></i> الرئيسية
                </a>
                <a href="{% url 'main:add_post' %}" class="btn-primary">
                    <i class="bi bi-plus-lg"></i> مقال جديد
                </a>
            </nav>
        </div>
    </header>

    <main class="container page">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">© 2026 Blogger · مساحتك للكتابة</div>
    </footer>

</body>
</html>
