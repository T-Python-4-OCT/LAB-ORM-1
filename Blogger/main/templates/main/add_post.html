{% extends 'main/base.html' %}

{% block title %}Add Post | Blogger{% endblock %}

{% block content %}
<h1 class="page-title">Add a New Post</h1>

<form method="post" enctype="multipart/form-data" class="post-form">
    {% csrf_token %}

    <p>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" class="form-input" maxlength="2048" required>
    </p>

    <p>
        <label for="content">Content</label>
        <textarea id="content" name="content" class="form-input" rows="8" required></textarea>
    </p>

    <p>
        <label for="poster">Image</label>
        <input type="file" id="poster" name="poster" class="form-input" accept="image/*">
    </p>

    <p>
        <label>
            <input type="checkbox" name="is_published" checked>
            Publish this post
        </label>
    </p>

    <button type="submit" class="btn">Publish</button>
</form>
{% endblock %}
