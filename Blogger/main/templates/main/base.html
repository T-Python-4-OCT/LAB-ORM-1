{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1324">
    <title>{% block title %}Blogger{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet" />
    <link href="{% static 'css/main.css' %}?v=5" rel="stylesheet" />
    <link rel="icon" href="{% static 'images/logo.svg' %}" type="image/svg+xml" />
  </head>
  <body>

    <header class="site-header" id="siteHeader">
      <div class="container header-inner">
        <a class="brand" href="{% url 'main:home_view' %}">
          <span class="brand-mark">B</span>
          <span>Blogger</span>
        </a>

        <nav class="main-nav" lang="ar" aria-label="Main">
          <a class="{% if request.resolver_match.view_name == 'main:home_view' %}active{% endif %}" href="{% url 'main:home_view' %}">الرئيسية</a>
          <a class="{% if request.resolver_match.view_name == 'posts:add_post_view' %}active{% endif %}" href="{% url 'posts:add_post_view' %}">اكتب</a>
          <a class="{% if request.resolver_match.view_name == 'posts:search_posts_view' %}active{% endif %}" href="{% url 'posts:search_posts_view' %}">بحث</a>
        </nav>

        <div class="header-actions">
        <form class="header-search" action="{% url 'posts:search_posts_view' %}" method="get" role="search">
          <span class="icon">search</span>
          <input type="search" name="search" placeholder="Search posts…" aria-label="Search" />
        </form>

        <a class="btn btn-primary header-new" href="{% url 'posts:add_post_view' %}" lang="ar" aria-label="منشور جديد">
          <span class="icon">add</span>
          <span>منشور جديد</span>
        </a>
        </div>
      </div>
    </header>

    <main class="container page">
      {% block content %}
      {% endblock %}
    </main>

    {% for message in messages %}
      <div class="toast" role="status">
        <span class="icon">check_circle</span>
        <span>{{ message }}</span>
      </div>
    {% endfor %}

    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="brand" href="{% url 'main:home_view' %}">
          <span class="brand-mark">B</span>
          <span>Blogger</span>
        </a>
        <nav class="footer-links">
          <a href="{% url 'main:home_view' %}">Home</a>
          <a href="{% url 'posts:search_posts_view' %}">Search</a>
          <a href="{% url 'posts:add_post_view' %}">Write a post</a>
        </nav>
        <span>&copy; {% now "Y" %} Blogger</span>
      </div>
    </footer>

    <script src="{% static 'js/main.js' %}?v=5"></script>
  </body>
</html>
