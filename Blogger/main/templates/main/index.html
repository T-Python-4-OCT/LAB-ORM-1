{% extends 'main/base.html' %}

{% block title %}Blogger | Latest Posts{% endblock %}

{% block content %}

<h2 class="section-label">Latest Posts</h2>

<div class="posts-grid">
{% for post in posts %}
    {% include 'main/post_card.html' %}
{% empty %}
    <div class="empty">
        <p>No posts yet. The press is quiet today.</p>
        <a href="{% url 'main:add_post_view' %}">Write the first post &rarr;</a>
    </div>
{% endfor %}
</div>

{% endblock %}
