
{% extends 'main/base.html' %}

{% block title %}Delete Post | Blogger{% endblock %}

{% block content %}

    <div class="card">
        <h1>Delete Post</h1>

        <p>Are you sure you want to delete "{{ post.title }}"?</p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn">
                Yes, Delete
            </button>

            <a href="{% url 'post_detail' post.id %}" class="btn">
                Cancel
            </a>
        </form>
    </div>

{% endblock %}
