{% extends 'main/base.html' %}

{% block title %}Update Post | Blogger{% endblock %}

{% block content %}
<a href="{% url 'main:post_detail' post.id %}" class="back-link">&larr; Back to Post</a>

<h1 class="page-title">Update Post</h1>

<form method="post" enctype="multipart/form-data" class="post-form">
    {% csrf_token %}

    <p>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" class="form-input"
               maxlength="2048" value="{{ post.title }}" required>
    </p>

    <p>
        <label for="content">Content</label>
        <textarea id="content" name="content" class="form-input" rows="8" required>{{ post.content }}</textarea>
    </p>

    <p>
        <label for="poster">Image</label>
        {% if post.poster %}
            <img src="{{ post.poster.url }}" alt="Current image" class="current-image">
        {% endif %}
        <input type="file" id="poster" name="poster" class="form-input" accept="image/*">
    </p>

    <p>
        <label>
            <input type="checkbox" name="is_published" {% if post.is_published %}checked{% endif %}>
            Publish this post
        </label>
    </p>

    <button type="submit" class="btn">Save Changes</button>
</form>
{% endblock %}
