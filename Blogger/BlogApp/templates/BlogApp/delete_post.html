
{% extends 'BlogApp/base.html' %}

{% block title %}Delete Post | Blogger{% endblock %}

{% block content %}

<section class="add-post-section delete-post-section">

    <h1>Delete Article</h1>

    <p>
        Are you sure you want to delete this article?
    </p>

    <div class="delete-post-preview">
        <h3>{{ post.title }}</h3>

        {% if post.image %}
            <img
                src="{{ post.image.url }}"
                alt="{{ post.title }}"
                style="width: 200px; border-radius: 12px;"
            >
        {% endif %}
    </div>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="delete-button">
            Yes, Delete Article
        </button>

        <a href="{% url 'home' %}" class="cancel-button">
            Cancel
        </a>
    </form>

</section>

{% endblock %}
