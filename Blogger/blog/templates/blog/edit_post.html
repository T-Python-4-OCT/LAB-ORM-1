{% extends 'blog/base.html' %}

{% block title %}Edit Post | Blogger{% endblock %}

{% block content %}

<section class="form-section">

    <a href="{% url 'post_detail' post.pk %}" class="back-link">
        ← Back to Post
    </a>

    <div class="form-heading">
        <span class="section-label">UPDATE CONTENT</span>
        <h1>Edit Your Post</h1>
        <p>Update your article and image.</p>
    </div>

    <form method="POST"
          enctype="multipart/form-data"
          class="post-form">

        {% csrf_token %}

        <label for="title">Post Title</label>

        <input type="text"
               id="title"
               name="title"
               value="{{ post.title }}"
               required>

        <label for="content">Post Content</label>

        <textarea id="content"
                  name="content"
                  rows="10"
                  required>{{ post.content }}</textarea>

        {% if post.poste %}

            <label>Current Image</label>

            <img src="{{ post.poste.url }}"
                 class="current-image"
                 alt="{{ post.title }}">

            <label class="remove-image">
                <input type="checkbox" name="remove_image">
                Remove Current Image
            </label>

        {% endif %}

        <label for="poste">Upload New Image</label>

        <input type="file"
               id="poste"
               name="poste"
               accept="image/*">

        <div class="form-actions">

            <a href="{% url 'post_detail' post.pk %}"
               class="cancel-button">
                Cancel
            </a>

            <button type="submit" class="primary-button">
                Save Changes
            </button>

        </div>

    </form>

</section>

{% endblock %}
