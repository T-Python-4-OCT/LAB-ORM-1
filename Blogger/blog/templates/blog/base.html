{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Blogger{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>

<body>

    <header class="navbar">
        <div class="nav-container">

            <a href="{% url 'home' %}" class="logo">
                Blogger<span>.</span>
            </a>

            <nav>
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'add_post' %}" class="nav-button">
                    Write a Post
                </a>
            </nav>

        </div>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer>
        <p>© 2026 Blogger. All rights reserved.</p>
    </footer>

</body>
</html>
