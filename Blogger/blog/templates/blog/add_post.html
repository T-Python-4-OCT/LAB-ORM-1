{% extends 'blog/base.html' %}

{% block title %}Add Post | Blogger{% endblock %}

{% block content %}

<section class="form-section">

    <a href="{% url 'home' %}" class="back-link">
        ← Back to Home
    </a>

    <div class="form-heading">
        <p class="section-label">CREATE CONTENT</p>
        <h1>Write a New Post</h1>
        <p>Share your ideas and thoughts with the world.</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="post-form">

        {% csrf_token %}

        <label for="title">Post Title</label>
        <input type="text" id="title" name="title"
               placeholder="Enter your post title..." required>

        <label for="content">Post Content</label>
        <textarea id="content" name="content" rows="10"
                  placeholder="Write your article here..." required></textarea>

        <label for="image">Post Image</label>
        <input type="file" id="image" name="image" accept="image/*">

        <div class="form-actions">
            <a href="{% url 'home' %}" class="cancel-button">Cancel</a>
            <button type="submit" class="primary-button">Publish Post</button>
        </div>

    </form>

</section>

{% endblock %}
