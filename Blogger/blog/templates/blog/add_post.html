
{% extends 'blog/base.html' %}

{% block title %}New Post | Blogger{% endblock %}

{% block content %}

<section class="form-section">

    <div class="form-heading">
        <span class="section-label">CREATE SOMETHING NEW</span>
        <h1>Write a <span>New Post.</span></h1>
        <p>Share your thoughts and ideas with the world.</p>
    </div>

    <form method="POST" class="post-form">

        {% csrf_token %}

        <label for="title">Post Title</label>
        <input
            type="text"
            id="title"
            name="title"
            maxlength="2048"
            placeholder="Enter your post title..."
            required
        >

        <label for="content">Post Content</label>
        <textarea
            id="content"
            name="content"
            rows="10"
            placeholder="Write your thoughts here..."
            required
        ></textarea>

        <div class="form-actions">
            <a href="{% url 'home' %}" class="cancel-button">
                Cancel
            </a>

            <button type="submit" class="primary-button">
                Publish Post →
            </button>
        </div>

    </form>

</section>

{% endblock %}
