{% extends 'main/base.html' %}

{% block content %}

<h1>Create Post</h1>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <!-- Title -->

    <label for="title">Title</label>

    <input type="text"
           id="title"
           name="title"
           maxlength="2048"
           placeholder="Enter post title"
           required>


    <!-- Content -->

    <label for="content">Content</label>

    <textarea id="content"
              name="content"
              rows="8"
              placeholder="Write your story..."
              required></textarea>


    <!-- Status -->

    <label for="is_published">Status</label>

    <select id="is_published" name="is_published">

        <option value="True">Published</option>

        <option value="False">Unpublished</option>

    </select>


    <!-- Poster -->

    <label for="poster">Poster</label>

    <input type="file"
           id="poster"
           name="poster"
           accept="image/*">


    <!-- Star Rating -->

    <div class="rating-section">

        <h3>Post Rating</h3>

        <div class="star-input">

            {% for star in "54321" %}

                <input type="radio"
                       name="rating"
                       id="star{{ star }}"
                       value="{{ star }}">

                <label for="star{{ star }}"
                       title="{{ star }} out of 5">★</label>

            {% endfor %}

        </div>

        <p>Select your rating out of 5 stars.</p>

    </div>


    <!-- Submit Button -->

    <button type="submit">
        Create Post
    </button>

</form>

{% endblock %}
