{% extends 'main/base.html' %}

{% block content %}

<h1>Update Post</h1>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <label>Post Title</label>

    <input
        type="text"
        name="title"
        value="{{ post.title }}"
        maxlength="2048"
        required
    >

    <br><br>

    <label>Post Content</label>

    <textarea
        name="content"
        rows="6"
        required
    >{{ post.content }}</textarea>

    <br><br>

    <label>Publication Status</label>

    <select name="is_published">

        <option value="True" {% if post.is_published %}selected{% endif %}>
            Published
        </option>

        <option value="False" {% if not post.is_published %}selected{% endif %}>
            Unpublished
        </option>

    </select>

    <br><br>

    <label>Current Image</label>

    {% if post.poster %}
        <br>
        <img src="{{ post.poster.url }}" width="200">
    {% endif %}

    <br><br>

    <label>Change Image</label>

    <input
        type="file"
        name="poster"
        accept="image/*"
    >

    <br><br>

    <button type="submit">
        Update Post
    </button>

</form>

{% endblock %}
