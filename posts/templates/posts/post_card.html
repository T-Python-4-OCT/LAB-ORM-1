
{% load static %}

<article class="post-card">
    <a
        href="{% url 'posts:post_detail' post.id %}"
        class="post-image-link"
        aria-label="Read {{ post.title }}"
    >
        {% if post.image %}
            <img
                src="{{ post.image.url }}"
                alt="{{ post.title }}"
                class="post-image"
                loading="lazy"
            />
        {% else %}
            <img
                src="{% static 'posts/images/default-post.webp' %}"
                alt="Peaceful sea and open book"
                class="post-image"
                loading="lazy"
            />
        {% endif %}
    </a>

    <div class="post-card-body">
        <div class="post-meta">
            <span class="post-author">
                <span
                    class="material-symbols-rounded"
                    aria-hidden="true"
                >
                    person
                </span>

                {{ post.author }}
            </span>

            <span class="post-date">
                {{ post.published_at|date:"M j, Y" }}
            </span>
        </div>

        <h3>
            <a href="{% url 'posts:post_detail' post.id %}">
                {{ post.title }}
            </a>
        </h3>

        <p class="post-excerpt">
            {{ post.content|striptags|truncatewords:35 }}
        </p>

        <a
            href="{% url 'posts:post_detail' post.id %}"
            class="read-more"
        >
            <span>Read More</span>

            <span
                class="material-symbols-rounded"
                aria-hidden="true"
            >
                arrow_forward
            </span>
        </a>
    </div>
</article>
